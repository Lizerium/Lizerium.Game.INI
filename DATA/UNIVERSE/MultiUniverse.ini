[universe]
; (НЕБЕЗОПАСНО) Принудительно перезагружать этот файл с диска при повторном открытии NavMap. 
;В результате появляется возможность обновления без выхода из игры.
debug = true

; Нижний текст, отображаемый на карте вселенной. Это строка IDS в библиотеках ресурсов.
display = 544683 ;1233 ; "NAVIGATION MAP"

; Текст подсказки, отображаемый над дополнительной кнопкой навигации. Это строка IDS в библиотеках ресурсов.
; TНовая модель кнопки — INTERFACE\NEURONET\NAVMAP\NEWNAVMAP\HUD_Navmap.3db
tooltip = 544682 ;1437 ; "NAV MAP" 

; Используйте плагин Territory.
; Если true, то в метке можно использовать только существующий house_id в [Houses] в Territory.ini. 
; Исключение составляют: 1249, 1250, 1251, 1252.
; Если задано значение false, в метке можно использовать любые идентификаторы, но для каждой карты доступно только 4 метки.
territory = false

; Общее количество столбцов (1-й параметр) и строк (2-й параметр) текстуры.
; Текстура взята из INTERFACE\NEURONET\NAVMAP\NEWNAVMAP\nav_prettymap.3db
texture = 9, 2

; Цвета пути имеют значения RGB[A].
; Первый параметр — это красный компонент от 0 до 255 значений.
; Второй параметр — это зеленый компонент от 0 до 255.
; Третий параметр — это синий компонент от 0 до 255.
; (необязательно) Четвертый параметр — это альфа-компонента от 0 до 255.

; Установить обычный цвет внутренних соединений.
path_inner = 150, 0, 150

; Установить цвет дополнительных внешних соединений.
; path_outer = 255, 255, 255

; Установите цвет соединений, когда они подсвечены, то есть путевые точки были установлены во вселенной.
path_light = 0, 200, 255

; Фон рисует квадратную текстуру с указанными индексами столбцов и строк.
; Первый параметр — это N-й столбец текстуры.
; 1-й параметр — N-я строка в текстуре.
background = 2, 2

; Сектор — это соединение NavStar и Map.
; Первое значение — это псевдоним [system] в universe.ini. Это связывает сектор с navstar.
; [system] в universe.ini (теперь как сектор) может быть настроен на visit, ids_info и strid_name. 
; visit будет использоваться как обычно. 
; 0: показать сектор, если только система была посещена внутри или была объявлена ??с visit = 1.
; 1: показать сектор.
; 128: скрыть сектор.
; strid_name будет использоваться для отображения имени сектора под курсором, а также для отображения его имени в нижней части карты.
; Второй параметр — это идентификатор карты в multiuniverse.ini
sector = cluster_1, liberty
sector = cluster_2, altair
sector = cluster_3, lira
sector = WHATEVER_NAME, andromeda
sector = cluster_5, betelgeize
sector = cluster_6, plejada
sector = cluster_7, kaprika
sector = cluster_8, fomalhout  
sector = cluster_9, stellacingulum
sector = cluster_10, rheinland
sector = cluster_11, kusari
sector = cluster_12, bretonia
sector = cluster_13, horizon
sector = cluster_14, proximalibella
sector = cluster_15, mysterious
sector = cluster_16, egypt

; NavStarScale — масштабный коэффициент для всех отображаемых навигационных звезд. Ключ может использоваться и в картах.
NavStarScale = 2.7

[map]
id = liberty

;(необязательно) ids
; Задайте текст, который будет отображаться на этой карте, тем самым перезаписав предыдущее значение, заданное сектором. 
; Текст будет напечатан в верхнем регистре.
; По умолчанию ids берется из strid_name [system], которая связана сектором, и может не потребоваться здесь. 
;ids = 2020

; На каждой карте можно задать до 4 меток.
; Первый параметр — строка IDS в библиотеках ресурсов dll.
