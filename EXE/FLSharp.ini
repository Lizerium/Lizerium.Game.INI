flight_controls_fix = true

;Исправлена ​​ошибка, из-за которой огни торгового коридора никогда не включались снова после того, как торговый коридор был нарушен.
;Исправлена ​​ошибка, из-за которой путевые точки очищались, когда игрок достигал координат в другой системе.
;Исправлена ​​ошибка, из-за которой игрок мог выбирать корабль для создания точек маршрута на навигационной карте.
;Заставляет эффект вспышки частиц оружия воспроизводиться на всех стволах, а не только на первом.
;Исправлена ​​ошибка, приводившая к one_shot_sound отсутствию воспроизведения при стрельбе из многоствольных гранатометов.
;Исправлена ​​ошибка, из-за которой количество боеприпасов не уменьшалось корректно при стрельбе из многоствольных гранатометов.
;Исправлена ​​ошибка, из-за которой use_animationскрипты, определенные в , weapon_equip.iniне работали, т. е. включалась анимация оружия.
;use_animationПозволяет воспроизводить сценарий орудия на родительском объекте (например, корабле), если имя анимации начинается с подчеркивания ( _); это подчеркивание не должно быть включено в имя анимации cmp-файла.
;Исправлена ​​ошибка, из-за которой клиент не отправлял на сервер корректное состояние двигателя корабля игрока.
;При игре на сервере убедитесь, что клиент отправляет обновление:
;по крайней мере каждые 2 секунды;
;при переключении функции глушения двигателя;
;если каждые 0,25 секунды ориентация корабля в той или иной степени изменялась.
;Устанавливает минимальное время между обновлениями клиент-сервер на уровне 40 миллисекунд (или 750 мс в режиме торговли), чтобы предотвратить дрожание при игре с высокой или непостоянной частотой кадров.
;Разрешить ui_music_testвоспроизведение после завершения воспроизведения текущей фоновой музыки.
;Добавлена ​​поддержка воспроизведения ui_interface_testзвуков ui_ambiance_testи при настройке соответствующих ползунков в меню параметров; эти звуки должны быть определены в interface_sounds.ini.
;Автоматически предотвращать сбои при настройке ползунков громкости интерфейса и окружения в случае, если тестовые звуки не определены.
;Регулируя громкость окружающей среды и музыки, отключите другие фоновые звуки, чтобы было легче настроить громкость.
;Позволяет выбирать до 127 разрешений в меню общих параметров; они автоматически определяются на основе разрешения основного монитора пользователя.
;Устранена проблема, из-за которой в меню общих параметров не различаются два разных разрешения с одинаковой шириной.
;Кнопка разрешения по умолчанию в меню общих параметров выбирает разрешение основного монитора пользователя вместо 1024x768.
;Не допускайте работы Freelancer с разрешениями, выходящими за рамки возможностей основного дисплея по ширине и высоте.
;Устанавливает разрешение основного монитора пользователя в качестве игрового разрешения по умолчанию (предполагается, что поддержка широкоэкранного режима уже добавлена ​​JFLP и HUD Shift).
;Вместо того чтобы проверять, поддерживаются ли доступные разрешения каждый раз при открытии меню параметров, делайте это только при необходимости (оптимизация).
;Позволяет использовать горячую клавишу Ctrl + C для копирования текста из любого поля ввода Freelancer в буфер обмена.
;Позволяет использовать горячую клавишу Ctrl + V для вставки текста из буфера обмена в любое поле ввода Freelancer.
;Улучшена анимация выдвижения некоторых кнопок пользовательского интерфейса в многопользовательских меню.
;Когда в меню дилера отображается сообщение «Вы должны быть на дружеских условиях, чтобы купить это»., разрешите также распечатать точное требование к репутации. Включите %dв IDS (S 1564, resources.dll), чтобы это сработало.
;Исправлена ​​ошибка, из-за которой процесс Freelancer не всегда завершался после закрытия игры.
;Автоматически устанавливайте блокировку вращения и автоматическое выравнивание на значения по умолчанию при запуске в космос, чтобы предотвратить возникновение проблем, связанных с управлением (например, не работает управление мышью).